[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrypermit"
version = "0.1.0"
description = "Policy-governed recovery for failed business events."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "google-auth>=2,<3",
  "google-adk[gcp]==2.8.0",
  "google-genai>=1.51,<3",
  "google-cloud-firestore>=2.28,<3",
  "google-cloud-pubsub>=2,<3",
  "google-cloud-tasks>=2.18,<3",
  "google-cloud-logging>=3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff==0.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "gcp: requires Google Cloud credentials and live services",
  "firestore_emulator: requires FIRESTORE_EMULATOR_HOST",
  "deployed: requires a deployed RetryPermit service",
]

[tool.coverage.run]
source = ["retrypermit"]
branch = true
